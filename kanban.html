<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 24px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding: 0 8px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-ghost {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.2);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .btn-icon {
            font-size: 14px;
        }

        /* Board */
        .board {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 24px;
            align-items: flex-start;
        }

        .board::-webkit-scrollbar {
            height: 8px;
        }

        .board::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }

        .board::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .board::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Columns */
        .column {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            min-width: 320px;
            max-width: 320px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 140px);
            cursor: grab;
            transition: all 0.2s ease;
        }

        .column.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .column.drag-over {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            margin-bottom: 16px;
        }

        .column-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .column-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .column-title:hover {
            background: rgba(255,255,255,0.08);
        }

        .column-title-input {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            padding: 6px 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            outline: none;
            width: 100%;
            background: rgba(255,255,255,0.1);
            font-family: inherit;
        }

        .column-card-count {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
        }

        .column-actions {
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            transition: all 0.15s ease;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.8);
        }

        .icon-btn.delete:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        /* Cards Container */
        .cards-container {
            flex: 1;
            overflow-y: auto;
            min-height: 60px;
            padding: 4px;
            margin: -4px;
        }

        .cards-container::-webkit-scrollbar {
            width: 6px;
        }

        .cards-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .cards-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
        }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 0.2s ease;
            position: relative;
        }

        .card:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .card-labels {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .label {
            width: 32px;
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .label:hover {
            transform: scaleY(1.5);
        }

        .label-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .label-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
        .label-green { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .label-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .label-purple { background: linear-gradient(135deg, #a855f7, #9333ea); }

        .card-content {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            line-height: 1.5;
            word-wrap: break-word;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 8px;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            color: #a5b4fc;
            text-decoration: none;
            transition: all 0.15s ease;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-link:hover {
            background: rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.5);
            color: #c7d2fe;
        }

        .card-link-icon {
            flex-shrink: 0;
        }

        .card-content-input {
            width: 100%;
            border: none;
            font-size: 14px;
            color: #fff;
            background: transparent;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
            min-height: 60px;
        }

        .card-footer {
            display: none;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .card:hover .card-footer {
            display: flex;
        }

        /* Add Card */
        .add-card-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            cursor: pointer;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            width: 100%;
            text-align: center;
            transition: all 0.15s ease;
            margin-top: 12px;
        }

        .add-card-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.8);
        }

        .add-card-form {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
        }

        .add-card-input {
            width: 100%;
            border: none;
            font-size: 14px;
            color: #fff;
            background: transparent;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
            min-height: 80px;
            margin-bottom: 12px;
        }

        .add-card-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .add-card-link-input {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
            color: #fff;
            background: rgba(255,255,255,0.05);
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            margin-bottom: 12px;
            transition: all 0.15s ease;
        }

        .add-card-link-input:focus {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .add-card-link-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .add-card-actions {
            display: flex;
            gap: 8px;
        }

        .add-card-actions .btn {
            padding: 8px 16px;
            font-size: 12px;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
        }

        /* Drop zone indicator */
        .drop-zone {
            border-radius: 12px;
            transition: all 0.15s ease;
        }

        .drop-zone.active {
            background: rgba(102, 126, 234, 0.1);
            min-height: 40px;
        }

        .card.drop-above::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 0;
            right: 0;
            height: 3px;
            background: #667eea;
            border-radius: 2px;
        }

        .card.drop-below::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            right: 0;
            height: 3px;
            background: #667eea;
            border-radius: 2px;
        }

        /* Label Picker */
        .label-picker {
            position: fixed;
            background: #1e1e2e;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 12px;
            z-index: 1000;
            min-width: 180px;
        }

        .label-picker-title {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .label-option {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 4px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.15s ease;
        }

        .label-option:last-child {
            margin-bottom: 0;
        }

        .label-option-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .label-option.label-red { background: rgba(239, 68, 68, 0.1); color: #f87171; }
        .label-option.label-red .label-option-dot { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .label-option.label-red:hover { background: rgba(239, 68, 68, 0.2); }

        .label-option.label-orange { background: rgba(249, 115, 22, 0.1); color: #fb923c; }
        .label-option.label-orange .label-option-dot { background: linear-gradient(135deg, #f97316, #ea580c); }
        .label-option.label-orange:hover { background: rgba(249, 115, 22, 0.2); }

        .label-option.label-green { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .label-option.label-green .label-option-dot { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .label-option.label-green:hover { background: rgba(34, 197, 94, 0.2); }

        .label-option.label-blue { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
        .label-option.label-blue .label-option-dot { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .label-option.label-blue:hover { background: rgba(59, 130, 246, 0.2); }

        .label-option.label-purple { background: rgba(168, 85, 247, 0.1); color: #c084fc; }
        .label-option.label-purple .label-option-dot { background: linear-gradient(135deg, #a855f7, #9333ea); }
        .label-option.label-purple:hover { background: rgba(168, 85, 247, 0.2); }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1e1e2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 28px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .modal input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 20px;
            outline: none;
            background: rgba(255,255,255,0.05);
            color: #fff;
            transition: all 0.15s ease;
        }

        .modal input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .modal input:focus {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.3);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .header-actions {
                flex-wrap: wrap;
            }

            .column {
                min-width: 280px;
                max-width: 280px;
            }
        }

        /* Jira Import Modal */
        .modal-wide { max-width: 620px !important; }

        .jira-preview-stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .jira-stat {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px 16px;
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .jira-stat-number {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
        }

        .jira-stat-label {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            margin-top: 4px;
        }

        .jira-column-list {
            margin-bottom: 16px;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .jira-column-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            font-size: 13px;
            gap: 8px;
        }

        .jira-column-name { color: rgba(255,255,255,0.85); font-weight: 500; flex: 1; }
        .jira-column-count { color: rgba(255,255,255,0.35); font-size: 12px; white-space: nowrap; }

        .jira-column-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .jira-column-badge.new {
            background: rgba(102,126,234,0.2);
            color: #a5b4fc;
            border: 1px solid rgba(102,126,234,0.3);
        }

        .jira-column-badge.existing {
            background: rgba(34,197,94,0.15);
            color: #86efac;
            border: 1px solid rgba(34,197,94,0.2);
        }

        .jira-skip-info {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 14px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
        }

        .jira-section-label {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Jira card metadata */
        .card-jira-meta {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
        }

        .jira-key {
            font-size: 11px;
            font-weight: 600;
            color: #a5b4fc;
            background: rgba(102,126,234,0.15);
            border: 1px solid rgba(102,126,234,0.25);
            border-radius: 4px;
            padding: 2px 6px;
            letter-spacing: 0.3px;
        }

        .jira-type {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
        }

        .jira-priority {
            font-size: 11px;
            font-weight: 500;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .jira-priority.critical, .jira-priority.highest { color: #fca5a5; background: rgba(239,68,68,0.15); }
        .jira-priority.high { color: #fdba74; background: rgba(249,115,22,0.15); }
        .jira-priority.medium { color: #93c5fd; background: rgba(59,130,246,0.15); }
        .jira-priority.low { color: #86efac; background: rgba(34,197,94,0.15); }
        .jira-priority.lowest { color: #d8b4fe; background: rgba(168,85,247,0.15); }

        .card-jira-details {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 2px;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
        }

        .jira-detail-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">📋</div>
            <h1>Kanban Board</h1>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="showAddColumnModal()">
                <span class="btn-icon">+</span> Add Column
            </button>
            <button class="btn btn-ghost" onclick="exportBoard()">
                <span class="btn-icon">↓</span> Export
            </button>
            <label class="btn btn-ghost">
                <span class="btn-icon">↑</span> Import
                <input type="file" id="importInput" accept=".txt,.json" onchange="importBoard(event)" style="display: none;">
            </label>
            <label class="btn btn-ghost">
                <span class="btn-icon">🔷</span> Import Jira
                <input type="file" id="jiraImportInput" accept=".csv" onchange="importJiraCSV(event)" style="display: none;">
            </label>
            <button class="btn btn-danger" onclick="clearBoard()">
                <span class="btn-icon">×</span> Clear
            </button>
        </div>
    </div>

    <div class="board" id="board"></div>

    <!-- Add Column Modal -->
    <div class="modal-overlay" id="addColumnModal" onclick="handleModalOverlayClick(event)">
        <div class="modal">
            <h2>Create New Column</h2>
            <input type="text" id="columnNameInput" placeholder="Enter column name..." onkeypress="handleColumnInputKeypress(event)">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="hideAddColumnModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addColumn()">Create</button>
            </div>
        </div>
    </div>

    <!-- Confirm Clear Modal -->
    <div class="modal-overlay" id="clearConfirmModal" onclick="handleClearModalClick(event)">
        <div class="modal">
            <h2>Clear Board?</h2>
            <p style="color: rgba(255,255,255,0.6); margin-bottom: 20px; font-size: 14px;">This will delete all columns and cards. This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="hideClearConfirmModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmClearBoard()">Yes, Clear All</button>
            </div>
        </div>
    </div>

    <!-- Jira Import Preview Modal -->
    <div class="modal-overlay" id="jiraImportModal" onclick="handleJiraModalOverlayClick(event)">
        <div class="modal modal-wide">
            <h2>Import from Jira CSV</h2>
            <div id="jiraPreviewContent"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="hideJiraImportModal()">Cancel</button>
                <button class="btn btn-primary" id="jiraImportConfirmBtn" onclick="confirmJiraImport()">Import</button>
            </div>
        </div>
    </div>

    <script>
        // Default board data
        const defaultData = {
            columns: [
                { id: 'col-1', title: 'To Do', cards: [
                    { id: 'card-1', content: 'Research project requirements and gather specifications', labels: ['blue'], link: 'https://jira.example.com/browse/PROJ-101' },
                    { id: 'card-2', content: 'Create wireframes for the new dashboard', labels: ['purple'], link: '' }
                ]},
                { id: 'col-2', title: 'In Progress', cards: [
                    { id: 'card-3', content: 'Build responsive landing page with animations', labels: ['green', 'blue'], link: 'https://jira.example.com/browse/PROJ-102' }
                ]},
                { id: 'col-3', title: 'Review', cards: []},
                { id: 'col-4', title: 'Done', cards: [
                    { id: 'card-4', content: 'Setup development environment', labels: ['green'], link: 'https://jira.example.com/browse/PROJ-100' }
                ]}
            ]
        };

        let boardData;
        let draggedCard = null;
        let draggedCardColumn = null;
        let draggedColumn = null;

        // Initialize
        function init() {
            loadData();
            renderBoard();
        }

        function loadData() {
            const saved = localStorage.getItem('kanbanBoard');
            boardData = saved ? JSON.parse(saved) : defaultData;
        }

        function saveData() {
            localStorage.setItem('kanbanBoard', JSON.stringify(boardData));
        }

        function generateId() {
            return 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            if (boardData.columns.length === 0) {
                board.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div class="empty-state-text">No columns yet. Click "Add Column" to get started!</div>
                    </div>
                `;
                return;
            }

            boardData.columns.forEach((column, index) => {
                board.appendChild(createColumnElement(column, index));
            });
        }

        function createColumnElement(column, index) {
            const colEl = document.createElement('div');
            colEl.className = 'column';
            colEl.dataset.columnId = column.id;
            colEl.draggable = true;
            colEl.ondragstart = (e) => handleColumnDragStart(e, column.id);
            colEl.ondragend = handleColumnDragEnd;
            colEl.ondragover = (e) => handleColumnDragOver(e, column.id);
            colEl.ondragleave = handleColumnDragLeave;
            colEl.ondrop = (e) => handleColumnDrop(e, column.id);

            const cardCount = column.cards.length;

            colEl.innerHTML = `
                <div class="column-header">
                    <div class="column-header-left">
                        <span class="column-title" onclick="editColumnTitle('${column.id}')">${escapeHtml(column.title)}</span>
                        <span class="column-card-count">${cardCount}</span>
                    </div>
                    <div class="column-actions">
                        <button class="icon-btn" onclick="clearColumn('${column.id}')" title="Clear all cards">🗑</button>
                        <button class="icon-btn delete" onclick="deleteColumn('${column.id}')" title="Delete column">✕</button>
                    </div>
                </div>
                <div class="cards-container" 
                     ondragover="handleDragOver(event)" 
                     ondrop="handleDrop(event, '${column.id}')"
                     ondragleave="handleDragLeave(event)">
                    ${column.cards.map(card => createCardHTML(card, column.id)).join('')}
                </div>
                <button class="add-card-btn" onclick="showAddCardForm('${column.id}')">
                    <span>+</span> Add a card
                </button>
                <div class="add-card-form" id="add-form-${column.id}" style="display: none;">
                    <textarea class="add-card-input" id="input-${column.id}" placeholder="What needs to be done?"></textarea>
                    <input type="text" class="add-card-link-input" id="link-input-${column.id}" placeholder="Link (e.g., https://jira.example.com/PROJ-123)">
                    <div class="add-card-actions">
                        <button class="btn btn-primary" onclick="addCard('${column.id}')">Add Card</button>
                        <button class="btn btn-secondary" onclick="hideAddCardForm('${column.id}')">Cancel</button>
                    </div>
                </div>
            `;

            return colEl;
        }

        function createCardHTML(card, columnId) {
            const labelsHtml = card.labels.map(label =>
                `<span class="label label-${label}" onclick="removeLabel('${card.id}', '${columnId}', '${label}')"></span>`
            ).join('');

            const linkDisplay = getLinkDisplayText(card.link);
            const linkHtml = card.link ? `
                <a href="${escapeHtml(card.link)}" class="card-link" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
                    <span class="card-link-icon">🔗</span>
                    <span>${escapeHtml(linkDisplay)}</span>
                </a>
            ` : '';

            let jiraMetaHtml = '';
            if (card.jira) {
                const { key, issueType, priority, assignee, dueDate, epicName } = card.jira;
                const priorityClass = (priority || '').toLowerCase().replace(/[^a-z]/g, '');
                const badges = [];
                if (key) badges.push(`<span class="jira-key">${escapeHtml(key)}</span>`);
                if (issueType) badges.push(`<span class="jira-type">${escapeHtml(issueType)}</span>`);
                if (priority) badges.push(`<span class="jira-priority ${priorityClass}">${escapeHtml(priority)}</span>`);
                const details = [];
                if (assignee) details.push(`<span class="jira-detail-item">👤 ${escapeHtml(assignee)}</span>`);
                if (dueDate) details.push(`<span class="jira-detail-item">📅 ${escapeHtml(dueDate)}</span>`);
                if (epicName) details.push(`<span class="jira-detail-item">⚡ ${escapeHtml(epicName)}</span>`);
                if (badges.length || details.length) {
                    jiraMetaHtml = `<div class="card-jira-meta">
                        ${badges.join('')}
                        ${details.length ? `<div class="card-jira-details">${details.join('')}</div>` : ''}
                    </div>`;
                }
            }

            return `
                <div class="card"
                     draggable="true"
                     data-card-id="${card.id}"
                     data-column-id="${columnId}"
                     ondragstart="handleDragStart(event, '${card.id}', '${columnId}')"
                     ondragend="handleDragEnd(event)"
                     ondragover="handleCardDragOver(event, '${card.id}', '${columnId}')"
                     ondragleave="handleCardDragLeave(event)"
                     ondrop="handleCardDrop(event, '${card.id}', '${columnId}')">
                    ${card.labels.length ? `<div class="card-labels">${labelsHtml}</div>` : ''}
                    <div class="card-content" onclick="editCard('${card.id}', '${columnId}')">${escapeHtml(card.content)}</div>
                    ${linkHtml}
                    ${jiraMetaHtml}
                    <div class="card-footer">
                        <button class="icon-btn" onclick="showLabelPicker(event, '${card.id}', '${columnId}')" title="Add label">🏷</button>
                        <button class="icon-btn" onclick="editCardLink('${card.id}', '${columnId}')" title="Edit link">🔗</button>
                        <button class="icon-btn delete" onclick="deleteCard('${card.id}', '${columnId}')" title="Delete">✕</button>
                    </div>
                </div>
            `;
        }

        function getLinkDisplayText(link) {
            if (!link) return '';
            // Extract ticket ID from URLs like /browse/PROJ-123 or /issues/PROJ-123
            const match = link.match(/\/(?:browse|issues)\/([A-Za-z0-9_-]+)(?:\?|$|#)/i)
                       || link.match(/\/(?:browse|issues)\/([A-Za-z0-9_-]+)$/i);
            if (match) return match[1];
            return link;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Modal helpers
        function handleModalOverlayClick(event) {
            if (event.target.classList.contains('modal-overlay')) {
                hideAddColumnModal();
            }
        }

        // Column operations
        function showAddColumnModal() {
            document.getElementById('addColumnModal').classList.add('active');
            document.getElementById('columnNameInput').focus();
        }

        function hideAddColumnModal() {
            document.getElementById('addColumnModal').classList.remove('active');
            document.getElementById('columnNameInput').value = '';
        }

        function handleColumnInputKeypress(event) {
            if (event.key === 'Enter') {
                addColumn();
            }
        }

        function addColumn() {
            const input = document.getElementById('columnNameInput');
            const title = input.value.trim();
            if (!title) return;

            boardData.columns.push({
                id: generateId(),
                title: title,
                cards: []
            });

            saveData();
            renderBoard();
            hideAddColumnModal();
        }

        function editColumnTitle(columnId) {
            const column = boardData.columns.find(c => c.id === columnId);
            const colEl = document.querySelector(`[data-column-id="${columnId}"]`);
            const titleEl = colEl.querySelector('.column-title');

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'column-title-input';
            input.value = column.title;

            const saveTitle = () => {
                const newTitle = input.value.trim();
                if (newTitle) {
                    column.title = newTitle;
                    saveData();
                }
                renderBoard();
            };

            input.onblur = saveTitle;
            input.onkeypress = (e) => {
                if (e.key === 'Enter') saveTitle();
            };

            titleEl.replaceWith(input);
            input.focus();
            input.select();
        }

        function deleteColumn(columnId) {
            if (!confirm('Delete this column and all its cards?')) return;
            boardData.columns = boardData.columns.filter(c => c.id !== columnId);
            saveData();
            renderBoard();
        }

        function clearColumn(columnId) {
            const column = boardData.columns.find(c => c.id === columnId);
            if (column.cards.length === 0) return;
            if (!confirm(`Clear all ${column.cards.length} card(s) from "${column.title}"?`)) return;
            column.cards = [];
            saveData();
            renderBoard();
        }

        // Column drag and drop
        function handleColumnDragStart(event, columnId) {
            // Prevent column drag when clicking on interactive elements
            if (event.target.closest('.icon-btn, .column-title, input, button')) {
                event.preventDefault();
                return;
            }
            draggedColumn = columnId;
            event.target.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('type', 'column');
        }

        function handleColumnDragEnd(event) {
            event.target.classList.remove('dragging');
            document.querySelectorAll('.column').forEach(col => {
                col.classList.remove('drag-over');
            });
            draggedColumn = null;
        }

        function handleColumnDragOver(event, columnId) {
            event.preventDefault();
            if (!draggedColumn || draggedColumn === columnId || draggedCard) return;
            event.currentTarget.classList.add('drag-over');
        }

        function handleColumnDragLeave(event) {
            event.currentTarget.classList.remove('drag-over');
        }

        function handleColumnDrop(event, targetColumnId) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');

            if (!draggedColumn || draggedColumn === targetColumnId || draggedCard) return;

            const sourceIndex = boardData.columns.findIndex(c => c.id === draggedColumn);
            const targetIndex = boardData.columns.findIndex(c => c.id === targetColumnId);

            const [column] = boardData.columns.splice(sourceIndex, 1);
            boardData.columns.splice(targetIndex, 0, column);

            draggedColumn = null;
            saveData();
            renderBoard();
        }

        // Card operations
        function showAddCardForm(columnId) {
            document.getElementById(`add-form-${columnId}`).style.display = 'block';
            document.querySelector(`[data-column-id="${columnId}"] .add-card-btn`).style.display = 'none';
            document.getElementById(`input-${columnId}`).focus();
        }

        function hideAddCardForm(columnId) {
            document.getElementById(`add-form-${columnId}`).style.display = 'none';
            document.querySelector(`[data-column-id="${columnId}"] .add-card-btn`).style.display = 'flex';
            document.getElementById(`input-${columnId}`).value = '';
            document.getElementById(`link-input-${columnId}`).value = '';
        }

        function addCard(columnId) {
            const input = document.getElementById(`input-${columnId}`);
            const linkInput = document.getElementById(`link-input-${columnId}`);
            const content = input.value.trim();
            const link = linkInput.value.trim();
            if (!content) return;

            const column = boardData.columns.find(c => c.id === columnId);
            column.cards.push({
                id: generateId(),
                content: content,
                labels: [],
                link: link || ''
            });

            saveData();
            renderBoard();
        }

        function editCard(cardId, columnId) {
            const column = boardData.columns.find(c => c.id === columnId);
            const card = column.cards.find(c => c.id === cardId);
            const cardEl = document.querySelector(`[data-card-id="${cardId}"]`);
            const contentEl = cardEl.querySelector('.card-content');

            const textarea = document.createElement('textarea');
            textarea.className = 'card-content-input';
            textarea.value = card.content;

            const saveContent = () => {
                const newContent = textarea.value.trim();
                if (newContent) {
                    card.content = newContent;
                    saveData();
                }
                renderBoard();
            };

            textarea.onblur = saveContent;
            textarea.onkeydown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    saveContent();
                }
            };

            contentEl.replaceWith(textarea);
            textarea.focus();
            textarea.select();
        }

        function deleteCard(cardId, columnId) {
            const column = boardData.columns.find(c => c.id === columnId);
            column.cards = column.cards.filter(c => c.id !== cardId);
            saveData();
            renderBoard();
        }

        function editCardLink(cardId, columnId) {
            event.stopPropagation();
            const column = boardData.columns.find(c => c.id === columnId);
            const card = column.cards.find(c => c.id === cardId);
            const currentLink = card.link || '';
            const newLink = prompt('Enter link (e.g., Jira URL):', currentLink);
            if (newLink !== null) {
                card.link = newLink.trim();
                saveData();
                renderBoard();
            }
        }

        // Labels
        let currentLabelPicker = null;

        function showLabelPicker(event, cardId, columnId) {
            event.stopPropagation();
            closeLabelPicker();

            const button = event.currentTarget;
            const rect = button.getBoundingClientRect();
            
            const picker = document.createElement('div');
            picker.className = 'label-picker';
            picker.innerHTML = `
                <div class="label-picker-title">Add Label</div>
                <button class="label-option label-red" onclick="addLabel('${cardId}', '${columnId}', 'red')">
                    <span class="label-option-dot"></span> Red
                </button>
                <button class="label-option label-orange" onclick="addLabel('${cardId}', '${columnId}', 'orange')">
                    <span class="label-option-dot"></span> Orange
                </button>
                <button class="label-option label-green" onclick="addLabel('${cardId}', '${columnId}', 'green')">
                    <span class="label-option-dot"></span> Green
                </button>
                <button class="label-option label-blue" onclick="addLabel('${cardId}', '${columnId}', 'blue')">
                    <span class="label-option-dot"></span> Blue
                </button>
                <button class="label-option label-purple" onclick="addLabel('${cardId}', '${columnId}', 'purple')">
                    <span class="label-option-dot"></span> Purple
                </button>
            `;

            document.body.appendChild(picker);
            
            // Position the picker above the button
            const pickerHeight = picker.offsetHeight;
            let top = rect.top - pickerHeight - 8;
            let left = rect.left - picker.offsetWidth + rect.width;
            
            // If it would go off the top, show below instead
            if (top < 10) {
                top = rect.bottom + 8;
            }
            
            // Keep it on screen horizontally
            if (left < 10) {
                left = 10;
            }
            
            picker.style.top = top + 'px';
            picker.style.left = left + 'px';
            
            currentLabelPicker = picker;

            setTimeout(() => {
                document.addEventListener('click', closeLabelPicker);
            }, 0);
        }

        function closeLabelPicker() {
            if (currentLabelPicker) {
                currentLabelPicker.remove();
                currentLabelPicker = null;
                document.removeEventListener('click', closeLabelPicker);
            }
        }

        function addLabel(cardId, columnId, label) {
            const column = boardData.columns.find(c => c.id === columnId);
            const card = column.cards.find(c => c.id === cardId);
            if (!card.labels.includes(label)) {
                card.labels.push(label);
                saveData();
                renderBoard();
            }
            closeLabelPicker();
        }

        function removeLabel(cardId, columnId, label) {
            event.stopPropagation();
            const column = boardData.columns.find(c => c.id === columnId);
            const card = column.cards.find(c => c.id === cardId);
            card.labels = card.labels.filter(l => l !== label);
            saveData();
            renderBoard();
        }

        // Drag and Drop for Cards
        function handleDragStart(event, cardId, columnId) {
            draggedCard = cardId;
            draggedCardColumn = columnId;
            event.target.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('type', 'card');
            event.stopPropagation();
        }

        function handleDragEnd(event) {
            event.target.classList.remove('dragging');
            document.querySelectorAll('.drop-zone, .drop-above, .drop-below').forEach(el => {
                el.classList.remove('active', 'drop-zone', 'drop-above', 'drop-below');
            });
        }

        function handleDragOver(event) {
            event.preventDefault();
            if (!draggedCard) return;
            event.currentTarget.classList.add('active');
            event.currentTarget.classList.add('drop-zone');
        }

        function handleDragLeave(event) {
            event.currentTarget.classList.remove('active');
            event.currentTarget.classList.remove('drop-zone');
        }

        function handleDrop(event, targetColumnId) {
            event.preventDefault();
            event.currentTarget.classList.remove('active');
            event.currentTarget.classList.remove('drop-zone');

            if (!draggedCard) return;

            // Find and remove card from source
            const sourceColumn = boardData.columns.find(c => c.id === draggedCardColumn);
            const cardIndex = sourceColumn.cards.findIndex(c => c.id === draggedCard);
            const [card] = sourceColumn.cards.splice(cardIndex, 1);

            // Add to end of target column
            const targetColumn = boardData.columns.find(c => c.id === targetColumnId);
            targetColumn.cards.push(card);

            draggedCard = null;
            draggedCardColumn = null;

            saveData();
            renderBoard();
        }

        // Card-to-card drag for reordering
        function handleCardDragOver(event, targetCardId, columnId) {
            event.preventDefault();
            event.stopPropagation();
            if (!draggedCard || draggedCard === targetCardId) return;

            const card = event.currentTarget;
            const rect = card.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;

            // Clear previous indicators
            document.querySelectorAll('.drop-above, .drop-below').forEach(el => {
                el.classList.remove('drop-above', 'drop-below');
            });

            if (event.clientY < midY) {
                card.classList.add('drop-above');
                card.classList.remove('drop-below');
            } else {
                card.classList.add('drop-below');
                card.classList.remove('drop-above');
            }
        }

        function handleCardDragLeave(event) {
            event.currentTarget.classList.remove('drop-above', 'drop-below');
        }

        function handleCardDrop(event, targetCardId, targetColumnId) {
            event.preventDefault();
            event.stopPropagation();

            const card = event.currentTarget;
            const dropAbove = card.classList.contains('drop-above');
            card.classList.remove('drop-above', 'drop-below');

            if (!draggedCard || draggedCard === targetCardId) return;

            // Remove card from source
            const sourceColumn = boardData.columns.find(c => c.id === draggedCardColumn);
            const sourceIndex = sourceColumn.cards.findIndex(c => c.id === draggedCard);
            const [movedCard] = sourceColumn.cards.splice(sourceIndex, 1);

            // Insert at target position
            const targetColumn = boardData.columns.find(c => c.id === targetColumnId);
            let targetIndex = targetColumn.cards.findIndex(c => c.id === targetCardId);

            // Adjust index if dropping below
            if (!dropAbove) targetIndex++;

            // Adjust if moving within same column and source was before target
            if (draggedCardColumn === targetColumnId && sourceIndex < targetIndex) {
                targetIndex--;
            }

            targetColumn.cards.splice(targetIndex, 0, movedCard);

            draggedCard = null;
            draggedCardColumn = null;

            saveData();
            renderBoard();
        }

        // Clear board
        function clearBoard() {
            document.getElementById('clearConfirmModal').classList.add('active');
        }

        function hideClearConfirmModal() {
            document.getElementById('clearConfirmModal').classList.remove('active');
        }

        function handleClearModalClick(event) {
            if (event.target.classList.contains('modal-overlay')) {
                hideClearConfirmModal();
            }
        }

        function confirmClearBoard() {
            boardData = { columns: [] };
            saveData();
            renderBoard();
            hideClearConfirmModal();
        }

        // Export board to file
        function exportBoard() {
            const dataStr = JSON.stringify(boardData, null, 2);
            const blob = new Blob([dataStr], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            const date = new Date().toISOString().slice(0, 10);
            a.download = `kanban-board-${date}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Import board from file
        function importBoard(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (!importedData.columns || !Array.isArray(importedData.columns)) {
                        throw new Error('Invalid file format');
                    }

                    for (const col of importedData.columns) {
                        if (!col.id || !col.title || !Array.isArray(col.cards)) {
                            throw new Error('Invalid column structure');
                        }
                        for (const card of col.cards) {
                            if (!card.id || !card.content) {
                                throw new Error('Invalid card structure');
                            }
                            if (!card.labels) card.labels = [];
                            if (!card.link) card.link = '';
                        }
                    }

                    if (confirm('This will replace your current board. Continue?')) {
                        boardData = importedData;
                        saveData();
                        renderBoard();
                    }
                } catch (error) {
                    alert('Error importing file: ' + error.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ---- Jira CSV Import ----
        let jiraPendingRows = null;

        function parseCSV(text) {
            const rows = [];
            let i = 0;
            const n = text.length;

            function parseField() {
                if (i < n && text[i] === '"') {
                    i++;
                    let field = '';
                    while (i < n) {
                        if (text[i] === '"' && text[i + 1] === '"') { field += '"'; i += 2; }
                        else if (text[i] === '"') { i++; break; }
                        else { field += text[i++]; }
                    }
                    return field;
                }
                let field = '';
                while (i < n && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r') {
                    field += text[i++];
                }
                return field;
            }

            function parseLine() {
                const fields = [];
                while (i < n && text[i] !== '\n' && text[i] !== '\r') {
                    fields.push(parseField());
                    if (i < n && text[i] === ',') i++;
                }
                if (i < n && text[i] === '\r') i++;
                if (i < n && text[i] === '\n') i++;
                return fields;
            }

            const headers = parseLine().map(h => h.trim());
            while (i < n) {
                const fields = parseLine();
                if (fields.every(f => f.trim() === '')) continue;
                const row = {};
                headers.forEach((h, idx) => { row[h] = (fields[idx] || '').trim(); });
                rows.push(row);
            }
            return rows;
        }

        function getJiraField(row, ...names) {
            for (const name of names) {
                const key = Object.keys(row).find(k => k.toLowerCase() === name.toLowerCase());
                if (key !== undefined && row[key] !== '') return row[key];
            }
            return '';
        }

        function priorityToLabel(priority) {
            const p = (priority || '').toLowerCase();
            if (p === 'critical' || p === 'highest') return 'red';
            if (p === 'high') return 'orange';
            if (p === 'medium') return 'blue';
            if (p === 'low') return 'green';
            if (p === 'lowest') return 'purple';
            return null;
        }

        function getExistingJiraKeys() {
            const keys = new Set();
            boardData.columns.forEach(col => {
                col.cards.forEach(card => { if (card.jira && card.jira.key) keys.add(card.jira.key); });
            });
            return keys;
        }

        function importJiraCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            event.target.value = '';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const rows = parseCSV(e.target.result);
                    if (rows.length === 0) { alert('The CSV file appears to be empty.'); return; }
                    const sample = rows[0];
                    const hasStatus = Object.keys(sample).some(k => k.toLowerCase() === 'status');
                    const hasSummary = Object.keys(sample).some(k => k.toLowerCase() === 'summary');
                    if (!hasStatus || !hasSummary) {
                        alert('Could not find required "Status" and "Summary" columns. Please ensure this is a valid Jira CSV export.');
                        return;
                    }
                    jiraPendingRows = rows;
                    showJiraPreviewModal(rows);
                } catch (err) {
                    alert('Error reading CSV: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function showJiraPreviewModal(rows) {
            const existingKeys = getExistingJiraKeys();
            const columnMap = {};
            let skipped = 0;

            rows.forEach(row => {
                const key = getJiraField(row, 'Issue key', 'Issue Key');
                if (key && existingKeys.has(key)) { skipped++; return; }
                const summary = getJiraField(row, 'Summary');
                if (!summary) return;
                const status = getJiraField(row, 'Status') || 'No Status';
                columnMap[status] = (columnMap[status] || 0) + 1;
            });

            const totalNew = Object.values(columnMap).reduce((a, b) => a + b, 0);
            const existingTitles = new Set(boardData.columns.map(c => c.title.toLowerCase()));

            let columnRowsHTML = Object.entries(columnMap).map(([status, count]) => {
                const isNew = !existingTitles.has(status.toLowerCase());
                const badge = isNew
                    ? `<span class="jira-column-badge new">New column</span>`
                    : `<span class="jira-column-badge existing">Existing</span>`;
                return `<div class="jira-column-row">
                    <span class="jira-column-name">${escapeHtml(status)}</span>
                    <span class="jira-column-count">${count} card${count !== 1 ? 's' : ''}</span>
                    ${badge}
                </div>`;
            }).join('');

            if (!columnRowsHTML) {
                columnRowsHTML = `<div style="color:rgba(255,255,255,0.4);font-size:13px;padding:8px 0;">No new items to import.</div>`;
            }

            const skipHTML = skipped > 0
                ? `<div class="jira-skip-info">&#x26A0; ${skipped} duplicate item${skipped !== 1 ? 's' : ''} already on the board will be skipped.</div>`
                : '';

            const newColCount = Object.keys(columnMap).filter(s => !existingTitles.has(s.toLowerCase())).length;

            document.getElementById('jiraPreviewContent').innerHTML = `
                <div class="jira-preview-stats">
                    <div class="jira-stat">
                        <div class="jira-stat-number">${totalNew}</div>
                        <div class="jira-stat-label">Cards to import</div>
                    </div>
                    <div class="jira-stat">
                        <div class="jira-stat-number">${Object.keys(columnMap).length}</div>
                        <div class="jira-stat-label">Columns mapped</div>
                    </div>
                    ${newColCount > 0 ? `<div class="jira-stat"><div class="jira-stat-number" style="color:#a5b4fc">${newColCount}</div><div class="jira-stat-label">New columns</div></div>` : ''}
                    ${skipped > 0 ? `<div class="jira-stat"><div class="jira-stat-number" style="color:#f87171">${skipped}</div><div class="jira-stat-label">Duplicates skipped</div></div>` : ''}
                </div>
                ${skipHTML}
                <div class="jira-section-label">Column mapping</div>
                <div class="jira-column-list">${columnRowsHTML}</div>
            `;

            document.getElementById('jiraImportConfirmBtn').disabled = totalNew === 0;
            document.getElementById('jiraImportModal').classList.add('active');
        }

        function hideJiraImportModal() {
            document.getElementById('jiraImportModal').classList.remove('active');
            jiraPendingRows = null;
        }

        function handleJiraModalOverlayClick(event) {
            if (event.target.classList.contains('modal-overlay')) hideJiraImportModal();
        }

        function confirmJiraImport() {
            if (!jiraPendingRows) return;
            const existingKeys = getExistingJiraKeys();

            jiraPendingRows.forEach(row => {
                const summary = getJiraField(row, 'Summary');
                if (!summary) return;

                const issueKey = getJiraField(row, 'Issue key', 'Issue Key');
                if (issueKey && existingKeys.has(issueKey)) return;

                const status = getJiraField(row, 'Status') || 'No Status';
                const priority = getJiraField(row, 'Priority');
                const assignee = getJiraField(row, 'Assignee');
                const dueDate = getJiraField(row, 'Due date', 'Due Date');
                const issueType = getJiraField(row, 'Issue Type', 'Issue type');
                const epicName = getJiraField(row,
                    'Custom field (Epic Name)', 'Custom field Epic Name',
                    'Epic Name', 'Epic name');

                let col = boardData.columns.find(c => c.title.toLowerCase() === status.toLowerCase());
                if (!col) {
                    col = { id: generateId(), title: status, cards: [] };
                    boardData.columns.push(col);
                }

                const label = priorityToLabel(priority);
                col.cards.push({
                    id: generateId(),
                    content: summary,
                    labels: label ? [label] : [],
                    link: '',
                    jira: { key: issueKey, issueType, priority, assignee, dueDate, epicName }
                });

                if (issueKey) existingKeys.add(issueKey);
            });

            saveData();
            renderBoard();
            hideJiraImportModal();
        }

        // Start the app
        init();
    </script>
</body>
</html>
